apiVersion: apps/v1
kind: Deployment
metadata:
  name: endixium
  namespace: endixium-prod
  labels:
    app: endixium
    phase: "prod"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endixium
  template:
    metadata:
      labels:
        app: endixium
        phase: "prod"
    spec:
      containers:
        - name: endixium
          image: ghcr.io/anthony-bible/endixium-prod@sha256:181010aaac1a6fccf435536ce508d3da7dc9e798d592207d16c8121604d0b837
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: endixium
  namespace: endixium-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "endixium.com"
      secretName: endixium-prod-tls
  rules:
    - host: "endixium.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: endixium
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: endixium
  namespace: endixium-prod
spec:
  selector:
    app: endixium
  ports:
    - name: http
      port: 80
      targetPort: http
